[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tesco-mcp"
version = "0.1.0"
description = "MCP server for Tesco IE/UK grocery search, prices, promotions, and nutrition."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tesco MCP Contributors" }]
keywords = ["mcp", "tesco", "grocery", "nutrition", "shopping", "ireland", "uk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/conormongan/tesco-mcp"
Repository = "https://github.com/conormongan/tesco-mcp"
Issues = "https://github.com/conormongan/tesco-mcp/issues"

[project.scripts]
tesco-mcp = "tesco_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tesco_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: tests that hit live Tesco APIs",
]
